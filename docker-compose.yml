services:
  db:
    image: postgres:15
    container_name: db
    # env_file:
    #   - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  pgadmin:
    image: elestio/pgadmin:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    # env_file:
    #   - .env  
    environment:
      - API_PORT:${API_PORT}
      - API_URL:http://backend:${API_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "--host", "--port", "3000"]
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    # environment:
    #   DB_HOST: db
    #   DB_USER: ${POSTGRES_USER}
    #   DB_PASSWORD: ${POSTGRES_PASSWORD}
    #   DB_NAME: ${POSTGRES_DB}
    #   API_PORT: ${API_PORT}
    #   # API_SECRET_KEY: ${API_SECRET_KEY}
    #   DATABASE_URL: ${DATABASE_URL}

    ports:
      - "${API_PORT}:5000"
      - "5555:5555"
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
  # redis_data:
