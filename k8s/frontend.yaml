apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: api-svcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: api-frontend:dev   # คุณ build ลง minikube ไว้แล้ว
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5173
        env:
        - name: VITE_PORT
          value: "5173"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: api-svcs
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30073   # เปิดจาก host:30073
