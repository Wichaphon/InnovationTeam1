apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: api-svcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: api-backend:dev   # คุณ build ลง minikube ไว้แล้ว
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: api-svcs
spec:
  type: NodePort   # NodePort เพื่อเปิดจากภายนอกได้
  selector:
    app: backend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080   # จะได้เรียกจาก host:30080
